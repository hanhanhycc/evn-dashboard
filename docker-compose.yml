services:
  evn-dashboard:
    # Build locally from the Dockerfile in this folder.
    # (If you prefer pulling the prebuilt image from GHCR instead, comment out
    # `build:` and uncomment `image:` below.)
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/hanhanhycc/evn-dashboard:latest

    container_name: evn-dashboard
    restart: unless-stopped
    ports:
      # host:container — change the host port (left side) if 3030 is taken on your NAS/server.
      - "3030:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # - UPSTREAM_TIMEOUT_MS=20000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# Nixpacks build config — used only if Coolify's Build Pack is set to "Nixpacks".
# Prefer setting Build Pack = "Dockerfile" in Coolify; this file is a safety net.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
# Install both server (root) and web (SPA) dependencies including devDeps for the build.
cmds = [
  "npm ci --include=dev",
  "npm --prefix web ci --include=dev",
]

[phases.build]
cmds = ["npm --prefix web run build"]

[start]
cmd = "node server.js"

[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
